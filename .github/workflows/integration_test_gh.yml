name: integration-tests
on: [workflow_call]

jobs:
  run-test:
    name: Integration Testing
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Get the original branch name
        run: |
          echo "Original branch: $GITHUB_HEAD_REF"

      - name: List directory contents
        run: |
          echo "Listing /home/runner/work/scout/ contents:"
          ls -R /home/runner/work/scout/

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . psrecord

      - name: Run and profile workflow
        run: |
          # (Optional) Make sure we have the right tools; often these are installed by default
          sudo apt-get update
          sudo apt-get install -y procps      
          # Start a background keep-alive loop with system stats
          while sleep 60; do
            date_time=$(date)
            # Grab CPU usage (user + sys) via top
            cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4}')
            # Grab memory usage % from 'free'
            mem_usage=$(free -m | awk 'NR==2{printf "%.2f", $3*100/$2 }')
            # Grab root volume disk usage (e.g. "/")
            disk_usage=$(df -h / | awk 'NR==2 {print $5}')
            echo "[Keep-alive] $date_time | CPU: ${cpu_usage}% | MEM: ${mem_usage}% | DISK: ${disk_usage} used"
          done &
          branch_ref="${{ github.ref }}"
          if [[ $branch_ref == 'refs/heads/master'  || $branch_ref == 'refs/heads/ci_outputs' ]]; then
            steps=("ecm_prep" "run")
            for step in "${steps[@]}"; do
              echo "Running profiler for step: $step"
              psrecord --log memory_log_${step}.txt --include-children --interval 1 "python tests/integration_testing/run_workflow.py --run_step $step --yaml tests/integration_testing/integration_test_new.yml --with_profiler"
              (echo -e; echo "# Elapsed time,CPU (%),Peak Real (MB),Peak Virtual (MB)"; grep -v "time" memory_log_${step}.txt | sort -k3 -n -r | head -n 1 | column -t | tr -s '[:blank:]' ',') >> tests/integration_testing/results/profile_${step}.csv
              mv memory_log_${step}.txt ./tests/integration_testing/results/
            done
          else
            python tests/integration_testing/run_workflow.py --yaml tests/integration_testing/integration_test_new.yml
          fi
          mv ./results/*.json ./tests/integration_testing/results/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: ./tests/integration_testing/results/

      - name: Commit test results
        run: |
          branch_ref="${{ github.ref }}"
          git pull origin $branch_ref
          git add ./tests/integration_testing/results/*.json
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          git commit --allow-empty -m "Upload results files from CI build"
          echo "Pushing to branch: $branch_ref"
          git push -u origin $branch_ref

          # Set status checks to success
          checks=("code-quality-checks" "python-tests (3.10)" "python-tests (3.11)" "python-tests (3.12)" "integration-tests / Integration Testing")
          commit_sha=$(git rev-parse HEAD)
          status_url="https://api.github.com/repos/${{ github.repository }}/statuses/$commit_sha"
          for check in "${checks[@]}"; do
            curl -L \
              -X POST \
              $status_url \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -d '{
                "state": "success",
                "context": "'"${check}"'",
                "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }'
          done
